          <p id="planner-hint" class="hint"></p>
        </section>

        <section id="itinerary" class="itinerary">
          <div class="empty-state">
            <p>🗺️ 还没有行程</p>
            <p class="hint">输入你的旅行想法，AI 自动生成带时间轴的避峰路线</p>
          </div>
        </section>
      </aside>

      <!-- 右侧：地图 -->
      <main id="map-wrap">
        <div id="map"></div>
        <!-- 行中工具栏 -->
        <div class="map-toolbar">
          <button data-tool="photo">📷<span>拍照识坑</span></button>
          <button data-tool="voice">🎤<span>语音排雷</span></button>
          <button data-tool="sos">🆘<span>应急求助</span></button>
          <button data-tool="aa">💰<span>AA算账</span></button>
        </div>
      </main>

      <!-- 悬浮 SOS 安全卡按钮 -->
      <button id="btn-safety" title="紧急安全备忘卡"><b>SOS</b></button>
    </div>
